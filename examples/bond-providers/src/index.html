<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bond providers</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font: 14px system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid #ccc;
      }
      header form,
      header label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      header input[type='text'] {
        width: 7em;
        text-transform: uppercase;
      }
      header .group {
        display: flex;
        gap: 10px;
        align-items: center;
        padding-left: 12px;
        border-left: 1px solid #ccc;
      }
      #status {
        flex: 1;
        min-width: 12em;
        color: #666;
      }
      /* two viewers side by side (src/load.ts) */
      .panes {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .panes section {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        border-left: 1px solid #ccc;
      }
      .panes section:first-child {
        border-left: none;
      }
      .panes h2 {
        margin: 0;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .viewer {
        position: relative;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <form id="load">
        <input id="code" type="text" aria-label="PDB ID or CCD code" placeholder="PDB / CCD" />
        <select id="kind" aria-label="Code kind" title="4 characters starting with a digit read as a PDB ID">
          <option value="auto">Auto</option>
          <option value="pdb">PDB</option>
          <option value="ccd">CCD</option>
        </select>
        <select id="coords" aria-label="CCD coordinates">
          <option value="ideal">Ideal coordinates</option>
          <option value="model">Model coordinates</option>
        </select>
        <button type="submit">Load</button>
      </form>
      <div class="group">
        <label>Bonds <select id="provider"></select></label>
        <select id="mode" aria-label="Perception mode">
          <option value="forceCompute">force compute</option>
          <option value="auto">auto</option>
        </select>
        <label><input id="removeH" type="checkbox" /> Remove H</label>
        <label><input id="removeCharges" type="checkbox" /> Remove charges</label>
      </div>
      <span id="status"></span>
    </header>
    <div class="panes">
      <section><h2>As served: built-in bonds</h2><div class="viewer" id="served"></div></section>
      <section><h2>Bond provider under test</h2><div class="viewer" id="tested"></div></section>
    </div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
