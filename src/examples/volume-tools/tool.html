<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Volume Tools</title>
    <link rel="stylesheet" type="text/css" href="./molstar.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }

        #layout { display: flex; width: 100%; height: 100%; }

        #viewer-container { flex: 1; position: relative; min-width: 0; }

        /* Mol* fills this div */
        #app { width: 100%; height: 100%; }

        #tool-panel {
            width: 320px;
            background: #222;
            overflow-y: auto;
            border-left: 1px solid #444;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        #tool-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 8px;
            border-bottom: 1px solid #444;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #tool-header a { color: #888; font-size: 11px; text-decoration: none; white-space: nowrap; }
        #tool-header a:hover { color: #ccc; }
        #tool-name { color: #fff; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <div id="layout">
        <div id="viewer-container">
            <div id="app" style="height: 100%;"></div>
        </div>
        <div id="tool-panel">
            <div id="tool-header">
                <a href="./">&larr; Volume Tools</a>
                <span id="tool-name"></span>
            </div>
            <div id="panel-root"></div>
        </div>
    </div>
    <script type="text/javascript" src="./index.js"></script>
</body>
</html>
