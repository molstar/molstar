packages:
  - 'packages/*'
  - 'packages/plugin/*'
  - 'packages/prism/*'
  - 'packages/ai/*'
  - 'packages/mvs/*'
  - 'extensions/*'
  - 'apps/*'
  - 'examples/*'
  - 'servers/*'
  - 'cli/*'
  - 'distributions/*'
  - 'smoke'
  - 'tests'
  - 'perf-tests'

catalog:
  'prettier': '3.9.9'
  '@biomejs/biome': '2.5.15'
  '@types/argparse': '2.0.17'
  '@types/benchmark': '2.1.5'
  '@types/compression': '1.8.1'
  '@types/express': '5.0.6'
  '@types/node': '22.20.1'
  '@types/swagger-ui-dist': '3.30.6'
  'argparse': '2.0.1'
  'compression': '1.8.2'
  'cors': '2.8.6'
  'express': '5.2.1'
  # Media encoding and containers (WebCodecs): the video export's Mediabunny backend and the AI narration's audio encoding (the browser's own AAC and Opus encoders); MPL-2.0, used unmodified.
  'mediabunny': '^1.61.3'
  'h264-mp4-encoder': '1.0.12'
  'immutable': '5.1.9'
  'io-ts': '2.2.22'
  'fp-ts': '2.16.11'
  'mutative': '1.3.0'
  'react-markdown': '10.1.0'
  'remark-gfm': '4.0.1'
  'rxjs': '7.8.2'
  'swagger-ui-dist': '5.33.1'
  'tslib': '2.8.1'
  '@types/cors': '2.8.19'
  '@types/gl': '6.0.5'
  '@types/jest': '30.0.0'
  '@types/pngjs': '6.0.5'
  '@types/react': '18.3.31'
  '@types/react-dom': '18.3.7'
  '@types/webxr': '0.5.24'
  'benchmark': '2.1.4'
  'concurrently': '10.0.5'
  'cross-spawn': '7.0.6'
  'cpx2': '9.0.0'
  'css-loader': '7.1.4'
  'esbuild': '0.28.1'
  'esbuild-jest-transform': '2.0.1'
  'esbuild-sass-plugin': '3.7.0'
  'fs-extra': '11.3.6'
  'http-server': '14.1.1'
  'jest': '30.5.2'
  'jest-environment-jsdom': '30.5.2'
  'jpeg-js': '0.4.4'
  'react': '18.3.1'
  'react-dom': '18.3.1'
  'sass': '1.105.1'
  'sass-embedded': '1.105.1'
  'simple-git': '4.0.2'
  'tsc-alias': '1.9.7'
  'typescript': '7.0.2'
  '@typescript/typescript6': '6.0.2'
  '@google-cloud/storage': '^7.14.0'
  'pngjs': '^6.0.0'
  'fflate': '^0.8.2'
  'playwright': '^1.58.0'
  'serve-static': '2.2.1'
  '@types/serve-static': '2.2.0'
  '@types/express-serve-static-core': '5.1.2'
  # Storybook (prism-ui only); all Storybook packages share one version.
  'storybook': '10.6.0'
  '@storybook/web-components-vite': '10.6.0'
  '@storybook/addon-docs': '10.6.0'
  '@storybook/addon-a11y': '10.6.0'
  'vite': '8.3.1'
  'lit': '3.3.3'
  'lightningcss': '1.33.0'
  # Icon extraction source (prism-ui only); ISC licensed.
  'lucide-static': '1.48.0'
  # Preact (prism-ui's React/Preact adapter tests and stories only); MIT licensed.
  'preact': '10.29.8'
  # The AI packages (@molstar/ai-*). The AI SDK and its providers (Apache-2.0) move fast, so only their major is pinned.
  'ai': '^7.0.124'
  '@ai-sdk/anthropic': '^4.0.70'
  '@ai-sdk/google': '^4.0.87'
  '@ai-sdk/openai': '^4.0.83'
  '@ai-sdk/openai-compatible': '^3.0.62'
  # The AI SDK's peer (its schemas); MIT licensed.
  'zod': '^4.6.5'
  # Property tests (the harness and its conformance suite); MIT licensed.
  'fast-check': '4.10.2'
  # IndexedDB in Node (the harness's IndexedDB storage tests only); Apache-2.0 licensed.
  'fake-indexeddb': '6.2.5'
  # The harness conformance suite imports the test API (it is a test library).
  '@jest/globals': '30.5.2'

overrides:
  # Mediabunny's pinned WebCodecs declarations conflict with the TypeScript 7 DOM library.
  '@types/dom-webcodecs': '0.1.19'
  '@istanbuljs/load-nyc-config>js-yaml': '^4.3.2'
  'concurrently>shell-quote': '^1.12.0'
  'source-map-js': '^1.2.2'
  '@types/express-serve-static-core': '5.1.2'
  '@types/node': '22.20.1'

# Native optional peers are installed explicitly, never by workspace setup.
autoInstallPeers: false

allowBuilds:
  esbuild: true
  sass-embedded: true
  unrs-resolver: true
  # Watcher uses platform packages; no source build is needed.
  '@parcel/watcher': false
  # Disable install-time telemetry.
  '@scarf/scarf': false
