<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <title>Mol* Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #eeece7;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1b1a18;
        }
      }
      #app {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>The Mol* viewer needs JavaScript.</noscript>
    <script type="module" src="./index.js"></script>
  </body>
</html>
