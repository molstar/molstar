name: Visual tests

# The visual smoke tests (`scripts/visual-tests.mjs --tags smoke`): each backend profile rendered in Chromium and
# compared with its reference (the WebGPU profiles with WebGL2, the WebGL ones with themselves), on software rendering:
# the runners have no GPU, so Mesa's (lavapipe Vulkan, llvmpipe GL), WebGL through ANGLE on Vulkan and WebGPU on Dawn's
# Vulkan. `--require-backends`: a profile whose backend Chromium does not provide fails instead of being skipped. The
# only image comparison of WebGPU against WebGL2 in CI. Nightly, by hand (Actions, Run workflow) and on a PR labelled
# `visual tests`.
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
  pull_request:
    branches: [master]
    types: [labeled, synchronize]

# one run per PR (or branch) at a time: a newer push or label cancels the one before
concurrency:
  group: visual-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual smoke tests
    # on a PR: labelled `visual tests`, on that label or a push (not on another label)
    if: >-
      github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'visual tests') &&
      (github.event.action != 'labeled' || github.event.label.name == 'visual tests'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Get the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chrome
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chrome's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Install Mesa's software Vulkan and GL
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri
      - name: Test
        run: >-
          pnpm test:visual --tags smoke --require-backends --allow-software --angle vulkan --browser-arg=--enable-features=Vulkan
          --browser-arg=--use-vulkan=native --images visual-failures
      - name: Upload the images of failed cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failures
          path: visual-failures
          if-no-files-found: ignore
