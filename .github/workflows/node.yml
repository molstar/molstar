name: Build

on:
  push:
    branches: master
  pull_request:
    branches: master
  workflow_dispatch:

jobs:
  style:
    name: Formatting and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint

  prism:
    name: Prism generated files and stories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the generated styles (and the spacing scale) and icons
        run: pnpm --filter "./packages/prism/*" run styles:check && pnpm --filter @molstar/prism-ui run icons:check
      - name: Type-check the stories and tests
        run: pnpm --filter "./packages/prism/*" run typecheck:storybook

  # The test lanes (AGENTS.md, Tests): the quick lane in shards, the medium lane (with the native GL suite) beside
  # them; the heavy lane runs nightly and on demand (tests-heavy.yml).
  test:
    name: Quick tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test:unit --shard=${{ matrix.shard }}/4

  medium:
    name: Medium tests (native GL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          # The opt-in native GL backend (`gl`) has no prebuilt binaries for Node 24 and fails to build from source;
          # this job stays on Node 22 until it has. The other jobs run on Node 24.
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache the native GL backend
        uses: actions/cache@v6
        with:
          path: .cache/native
          key: native-${{ runner.os }}-node22-${{ hashFiles('scripts/native.mjs') }}
      - name: Install opt-in native GL backend
        run: pnpm native:install
      - name: Install virtual display
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Test
        run: xvfb-run --auto-servernum pnpm test:native -- medium

  types:
    name: Full declaration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check all imported declarations with TypeScript 7
        run: pnpm check:types:full

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build libraries with TypeScript 7
        run: time pnpm build:lib
      - name: Build apps and examples
        run: time pnpm build:apps
      - name: Build browser distribution
        run: time pnpm build:distribution
      - name: Check workspace and versions
        run: pnpm check:workspace && pnpm version:check
      - name: Pack public packages
        run: pnpm pack:workspace
