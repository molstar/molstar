name: Build

on:
  push:
    branches: master
  pull_request:
    branches: master
  workflow_dispatch:

jobs:
  style:
    name: Formatting and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint

  prism:
    name: Prism generated files and stories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the generated styles (and the spacing scale) and icons
        run: pnpm --filter "./packages/prism/*" run styles:check && pnpm --filter @molstar/prism-ui run icons:check
      - name: Type-check the stories and tests
        run: pnpm --filter "./packages/prism/*" run typecheck:storybook

  # The test lanes (AGENTS.md, Tests): the quick lane in shards, the medium lane (with the native GL suite) and the
  # WebGPU tests on Dawn beside them; the heavy lane and the visual smoke tests run nightly and on demand
  # (tests-heavy.yml, visual-tests.yml).
  test:
    name: Quick tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test:unit --shard=${{ matrix.shard }}/4

  medium:
    name: Medium tests (native GL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          # The opt-in native GL backend (`gl`) has no prebuilt binaries for Node 24 and fails to build from source;
          # this job stays on Node 22 until it has. The other jobs run on Node 24.
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache the native GL backend
        uses: actions/cache@v6
        with:
          path: .cache/native
          key: native-${{ runner.os }}-node22-${{ hashFiles('scripts/native.mjs') }}
      - name: Install opt-in native GL backend
        run: pnpm native:install
      - name: Install virtual display
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Test
        run: xvfb-run --auto-servernum pnpm test:native -- medium

  # The headless WebGPU tests (`describe.skipIf(!WebGPU.module)`, quick-lane files) on Dawn's Node.js bindings over a
  # software Vulkan (Mesa's lavapipe: the runners have no GPU). Required: without Dawn or an adapter they fail instead of
  # skipping (`MOLSTAR_REQUIRE_WEBGPU`). `auto` prefers WebGPU, and nothing else in CI renders with it.
  webgpu:
    name: WebGPU tests (Dawn)
    runs-on: ubuntu-latest
    # a hang (a test blocking in a Dawn call, a worker that does not exit) fails here, not after GitHub's 6 hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          # as the medium job: the native backends' install stays on Node 22 (`gl` comes along, optional)
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install a software Vulkan
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers xvfb
      - name: Cache the native backends
        uses: actions/cache@v6
        with:
          path: .cache/native
          key: native-webgpu-${{ runner.os }}-node22-${{ hashFiles('scripts/native.mjs') }}
      - name: Install Dawn's Node.js bindings
        run: pnpm native:install -- --webgpu
      - name: Test
        env:
          MOLSTAR_REQUIRE_WEBGPU: '1'
        # rendered on the CPU, many times slower than a GPU: a longer timeout than the quick lane's 30 s (a test of tens of
        # frames of millions of spheres takes over 30 s there). Diagnosing a cancel at about 2 min (four workers and two
        # alike): one worker, so the test after the last one printed is the one running, and the memory every 5 s (the
        # devices' memory is in RAM on lavapipe)
        run: |
          (while sleep 5; do echo "memory: $(free -m | awk 'NR==2 {print $3 " of " $2 " MB used"}')"; done) &
          xvfb-run --auto-servernum pnpm native:run -- pnpm test:unit packages/plugin/headless packages/graphics \
            --testTimeout=180000 --hookTimeout=180000 --maxWorkers=1 --reporter=verbose

  types:
    name: Full declaration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check all imported declarations with TypeScript 7
        run: pnpm check:types:full

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build libraries with TypeScript 7
        run: time pnpm build:lib
      - name: Build apps and examples
        run: time pnpm build:apps
      - name: Build browser distribution
        run: time pnpm build:distribution
      - name: Check workspace and versions
        run: pnpm check:workspace && pnpm version:check
      - name: Pack public packages
        run: pnpm pack:workspace
