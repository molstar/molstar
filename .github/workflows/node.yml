name: Build

on:
  push:
    branches: master
  pull_request:
    branches: master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install opt-in native GL backend
        run: pnpm native:install
      - name: Install Chromium for browser smoke
        run: pnpm exec playwright install --with-deps chromium
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Lint
        run: pnpm lint
      - name: Test
        run: xvfb-run --auto-servernum pnpm test:native
      - name: Build workspace
        run: pnpm build
      - name: Check workspace and versions
        run: pnpm check:workspace && pnpm version:check
      - name: Pack public packages
        run: pnpm pack:workspace
      - name: Consumer smoke checks
        run: pnpm --dir smoke smoke:node && pnpm --dir smoke smoke:types && pnpm --dir smoke smoke:source && pnpm --dir smoke smoke:cli && pnpm --dir smoke smoke:browser
      - name: Headless consumer smoke
        run: xvfb-run --auto-servernum pnpm native:run -- pnpm --dir smoke smoke:headless
