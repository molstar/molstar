name: Build

on:
  push:
    branches: master
  pull_request:
    branches: master

jobs:
  style:
    name: Formatting and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint

  test:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          # The opt-in native GL backend (`gl`) has no prebuilt binaries for Node 24 and fails to build from source;
          # this job stays on Node 22 until it has. The other jobs run on Node 24.
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install opt-in native GL backend
        run: pnpm native:install
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test
        run: xvfb-run --auto-servernum pnpm test:native

  types:
    name: Full declaration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check all imported declarations with TypeScript 7
        run: pnpm check:types:full

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build libraries with TypeScript 7
        run: time pnpm build:lib
      - name: Build apps and examples
        run: time pnpm build:apps
      - name: Build browser distribution
        run: time pnpm build:distribution
      - name: Check workspace and versions
        run: pnpm check:workspace && pnpm version:check
      - name: Pack public packages
        run: pnpm pack:workspace
      - name: Install the smoke browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke (the packed distribution's Viewer, MVS Stories and Prism single file)
        run: node smoke/run.mjs browser
