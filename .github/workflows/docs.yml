name: Build & Deploy Docs

on:
  push:
    branches: master
    paths:
      - apps/docs/**
      - pnpm-workspace.yaml
      - '.github/workflows/docs.yml'
  pull_request:
    branches: master
    paths:
      - apps/docs/**
      - pnpm-workspace.yaml
      - '.github/workflows/docs.yml'

jobs:
  docs:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: 👨🏼‍💻 checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: ⛓️ dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔧 build site
        run: pnpm --filter @molstar/docs build

      # The site is built for pull requests too (a check); only a push to master publishes it.
      - name: 🚢 deploy docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
          external_repository: molstar/docs
          publish_branch: gh-pages
          publish_dir: ./apps/docs/dist
